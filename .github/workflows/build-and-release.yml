name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Build and test the solution
        run: |
          ./tests/ci/Find-ReleaseBuild.Tests.ps1
          dotnet test ProtoBench.slnx -c Release --logger trx --results-directory artifacts/test-results
          if ($LASTEXITCODE -ne 0) { throw 'Solution build or tests failed.' }
      - name: Determine package version
        id: version
        run: |
          [xml]$properties = Get-Content Directory.Build.props -Raw
          $version = [string]$properties.Project.PropertyGroup.Version
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Package installer, portable app and SDK
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        run: ./scripts/Build-Release.ps1 -Version $env:PACKAGE_VERSION -GitHubRepository $env:GITHUB_REPOSITORY -OutputDirectory artifacts/release
      - name: Upload portable app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ProtoBench-${{ steps.version.outputs.value }}-${{ github.run_number }}-portable
          overwrite: true
          path: artifacts/release/ProtoBench-*-win-x64.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload Windows installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ProtoBench-${{ steps.version.outputs.value }}-${{ github.run_number }}-installer
          overwrite: true
          path: artifacts/release/*-Setup.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload update feed and packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ProtoBench-${{ steps.version.outputs.value }}-${{ github.run_number }}-updates
          overwrite: true
          path: |
            artifacts/release/*.nupkg
            artifacts/release/releases.win.json
            artifacts/release/latest.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload SDK, developer kit and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ProtoBench-${{ steps.version.outputs.value }}-${{ github.run_number }}-sdk
          overwrite: true
          path: |
            artifacts/release/ProtoBench-SDK-*.zip
            artifacts/release/ProtoBench-DeveloperKit-*.zip
            artifacts/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ github.run_number }}
          overwrite: true
          path: artifacts/test-results/*.trx
          if-no-files-found: ignore
          retention-days: 14
