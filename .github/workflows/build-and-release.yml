name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 45
    outputs:
      artifact-name: ProtoBench-${{ steps.version.outputs.value }}-${{ github.run_number }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Build and test the solution
        run: |
          dotnet test ProtoBench.slnx -c Release --logger trx --results-directory artifacts/test-results
          if ($LASTEXITCODE -ne 0) { throw 'Solution build or tests failed.' }
      - name: Determine package version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          $version = '2.0.0'
          if ($env:IS_TAG -eq 'true') {
            if ($env:REF_NAME -notmatch '^v(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') { throw 'Release tags must use vMAJOR.MINOR.PATCH, optionally followed by a prerelease suffix.' }
            $version = $Matches[1]
          }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Package app and SDK
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        run: ./scripts/Build-Release.ps1 -Version $env:PACKAGE_VERSION -OutputDirectory artifacts/release
      - name: Upload build packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ProtoBench-${{ steps.version.outputs.value }}-${{ github.run_number }}
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ github.run_number }}
          path: artifacts/test-results/*.trx
          if-no-files-found: ignore
          retention-days: 14
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download verified build packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: artifacts/release
      - name: Publish packages to GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          $existing = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -ne 0) {
            $create = @('release', 'create', $tag, '--draft', '--verify-tag', '--title', "ProtoBench $tag", '--generate-notes')
            if ($tag.Contains('-')) { $create += '--prerelease' }
            gh @create
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create the draft release.' }
          }
          $assets = @(Get-ChildItem -LiteralPath artifacts/release -File | Select-Object -ExpandProperty FullName)
          gh release upload $tag @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Failed to upload release assets.' }
          gh release edit $tag --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish the release.' }
