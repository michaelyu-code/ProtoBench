name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify release version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') { throw 'Release tags must use vMAJOR.MINOR.PATCH, optionally followed by a prerelease suffix.' }
          $version = $Matches[1]
          [xml]$properties = Get-Content Directory.Build.props -Raw
          if ($version -cne [string]$properties.Project.PropertyGroup.Version) { throw 'The tag must match Version in Directory.Build.props so the existing build packages have the correct version.' }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Find successful main build for this commit
        id: build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve the tagged commit.' }
          $build = ./scripts/Find-ReleaseBuild.ps1 -Repository $env:GITHUB_REPOSITORY -Commit $commit -Version $env:PACKAGE_VERSION
          "run-id=$($build.Id)" >> $env:GITHUB_OUTPUT
          "artifact-name=$($build.ArtifactName)" >> $env:GITHUB_OUTPUT
      - name: Download verified build packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.build.outputs.run-id }}
          pattern: ${{ steps.build.outputs.artifact-name }}-*
          merge-multiple: true
          path: artifacts/release
      - name: Publish packages to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          $existing = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -ne 0) {
            $create = @('release', 'create', $tag, '--draft', '--verify-tag', '--title', "ProtoBench $tag", '--generate-notes')
            if ($tag.Contains('-')) { $create += '--prerelease' }
            gh @create
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create the draft release.' }
          }
          $assets = @(Get-ChildItem -LiteralPath artifacts/release -File | Select-Object -ExpandProperty FullName)
          if ($assets.Count -eq 0) { throw 'No release packages were downloaded.' }
          gh release upload $tag @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Failed to upload release assets.' }
          gh release edit $tag --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish the release.' }
